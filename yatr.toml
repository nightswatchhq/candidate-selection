# yatr - https://github.com/cargopete/yatr
#
# These tasks are what .github/workflows CI runs, command for command, so
# `yatr ci` locally is the same gate. The workflow calls these tasks by name:
# change a command here and CI changes with it.
#
# The aggregate is `ci`, not `check`: `yatr check` is a builtin that validates
# this file and shadows any task of that name without warning.

[env]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "full"

[settings]
cache = true

[tasks.fmt]
desc = "Format the tree (nightly rustfmt, as CI uses)"
run = ["cargo +nightly fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if unformatted (CI: format job, nightly toolchain)"
run = ["cargo +nightly fmt --all -- --check"]
sources = ["**/*.rs", "rustfmt.toml"]

[tasks.typecheck]
desc = "Release type-check across the workspace (CI: check (release))"
run = ["cargo check --workspace --all-targets --all-features --release"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]

[tasks.lint]
desc = "Clippy with warnings denied (CI: clippy)"
run = ["cargo clippy --workspace --all-targets --all-features -- -D warnings --force-warn deprecated --force-warn dead-code"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]

[tasks.test]
desc = "Unit tests (CI: unit-tests)"
run = ["cargo test --all-features --lib"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]
watch = ["**/*.rs"]

[tasks.build]
desc = "Build in release mode"
run = ["cargo build --workspace --release"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]

[tasks.ci]
desc = "What CI runs: fmt-check, typecheck, lint, test"
depends = ["fmt-check", "typecheck", "lint", "test"]
run = []

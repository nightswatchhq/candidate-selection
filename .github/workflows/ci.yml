name: ci
on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  GH_USER: ${{ github.repository_owner }}
  GH_TOKEN: ${{ secrets.GH_PRIVATE_TOKEN }}

  # The commands CI runs live in yatr.toml, so `yatr ci` locally is the
  # same gate. Bump deliberately.
  YATR_VERSION: "1.1.0"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache rust build files
        uses: Leafwing-Studios/cargo-cache@a0709d80dd96c8734ac8f186c1f238c8f528d198 # v2

      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        # RUSTFLAGS is cleared deliberately: yatr is a different crate and must
        # not inherit this project's flags (a `-D warnings` or a custom linker
        # would fail or mislink the install).
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - name: check (release)
        run: yatr typecheck

      - name: clippy
        run: yatr lint

      - name: unit-tests
        run: yatr test

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt

      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        # RUSTFLAGS is cleared deliberately: yatr is a different crate and must
        # not inherit this project's flags (a `-D warnings` or a custom linker
        # would fail or mislink the install).
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - run: yatr fmt-check
